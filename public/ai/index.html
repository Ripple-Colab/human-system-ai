<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Human System of AI</title>
<style>
@font-face { font-family: "Josefin Sans"; src: url("/fonts/JosefinSans.woff2") format("woff2"); font-weight: 100 700; font-display: swap; }
@font-face { font-family: "Karla"; src: url("/fonts/Karla.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
</style>
<style>
/* Layout: the Ripple CoLab web register. A light actor map, navy lines and labelled nodes on paper;
   the chronicle top-left, the guide as a ruled side column, the timeline as a rail whose current node is rose.
   Deliberately one theme: the system's web register is light. */
:root {
  --paper: #FCFBF8;
  --cream: #F7F2EA;
  --navy: #24315C;
  --navy-ink: #1A2238;
  --ink: #3A3F55;
  --rose: #CC908F;
  --hair: #EAE4D9;
  --shade: #BFBFBF;
  --ice: #DCE1E7;
  --bluegrey: #A0AAB2;
  --work: #24315C;
  --money: #D3B46F;
  --tie: #344C4D;
  --rift: #7A5C6E;
  --scrim: rgba(252, 251, 248, 0.9);
  --font-display: "Josefin Sans", "Futura", "Century Gothic", system-ui, sans-serif;
  --font-text: "Karla", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --panel-w: 352px;
  color-scheme: light;
}

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-text); font-size: 14px; line-height: 1.5; overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: var(--navy); }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }

/* Header */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px 24px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--hair); background: var(--paper); position: relative; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand a.logo { display: block; flex: none; line-height: 0; }
.brand a.logo img { height: 34px; width: auto; }
.brand .rule { width: 1px; align-self: stretch; background: var(--hair); }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 300; font-size: 26px; line-height: 1.1; color: var(--navy); text-wrap: balance; }
.brand p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink); }
.flows { display: flex; gap: 2px 14px; flex-wrap: wrap; align-items: center; }
.tog {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 2px; border: 0; background: none; cursor: pointer;
  font-size: 13.5px; font-weight: 500; color: var(--navy); white-space: nowrap; flex: none;
}
.tog[aria-pressed="false"] { opacity: 0.4; }
.tog:hover { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--hair); }
.sw { width: 20px; height: 8px; flex: none; overflow: visible; }
.guide-btn { display: none; }

/* Stage */
.stage { position: relative; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map:active { cursor: grabbing; }
.bigyear {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: -0.12em;
  font-family: var(--font-display); font-weight: 300; font-size: clamp(110px, 18vw, 260px); line-height: 1;
  color: var(--navy); opacity: 0.06; pointer-events: none; user-select: none; font-variant-numeric: tabular-nums;
}

/* Map marks */
.lk { fill: none; stroke-linecap: round; transition: opacity 0.6s ease, stroke-width 0.3s ease; opacity: 0; pointer-events: none; }
.lk.on { opacity: 0.42; }
.lk.past { opacity: 0.08; }
.lk.work { stroke: var(--work); stroke-width: 1.1; }
.lk.work.founder { stroke-width: 1.7; }
.lk.work.board { stroke-dasharray: 1 3.5; stroke-width: 1.5; }
.lk.money { stroke: var(--money); stroke-width: 1.8; }
.lk.money.on { opacity: 0.75; }
.lk.money.invest { stroke-dasharray: 5 6; }
.lk.money.invest.on { animation: flow 2.4s linear infinite; }
.lk.money.acquire { stroke-width: 4; }
.lk.money.acquire.on { opacity: 0.45; }
.lk.money.partner { stroke-dasharray: 1.5 4; stroke-width: 2.2; }
.lk.tie { stroke: var(--tie); stroke-width: 1.4; }
.lk.tie.on { opacity: 0.7; }
.lk.rift { stroke: var(--rift); stroke-width: 1.6; stroke-dasharray: 6 3 2 3; }
.lk.rift.on { opacity: 0.85; }
.lk.on.dim { opacity: 0.06; }
.lk.on.hl { opacity: 1; stroke-width: 3; }
.lk.on.near { opacity: 1; }
@keyframes flow { to { stroke-dashoffset: -22; } }
.hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: none; cursor: pointer; }
.hit.on { pointer-events: stroke; }
svg.hide-work .lk.work, svg.hide-money .lk.money, svg.hide-tie .lk.tie, svg.hide-rift .lk.rift { display: none; }
svg.hide-work .hit.work, svg.hide-money .hit.money, svg.hide-tie .hit.tie, svg.hide-rift .hit.rift { display: none; }

.nd { cursor: pointer; }
.nd .body { transition: opacity 0.6s ease, transform 0.6s cubic-bezier(.2,.8,.2,1); transform-origin: 0 0; }
.nd.off { pointer-events: none; }
.nd.off .body { opacity: 0; transform: scale(0.3); }
.nd.dim .body { opacity: 0.18; }
.sq { fill: #FFFFFF; stroke: var(--shade); stroke-width: 1; }
.sq.unvalued { stroke-dasharray: 3 3; }
.logo { fill: var(--navy); }
.mono { fill: var(--navy); font-family: var(--font-text); font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.disc { fill: var(--ice); }
.rim { fill: none; stroke: var(--shade); stroke-width: 1; }
.ini { fill: var(--navy); font-family: var(--font-text); font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.ring { fill: none; stroke: var(--navy); stroke-width: 1.5; opacity: 0; transition: opacity 0.3s; }
.nd.sel .ring { opacity: 1; }
.nd.hov:not(.sel) .ring { opacity: 0.35; }
.nd.ev .rim, .nd.ev .sq { stroke: var(--navy); stroke-width: 1.6; }
.nlabel {
  font-family: var(--font-text); font-size: calc(11px / var(--zk, 1)); fill: var(--ink); text-anchor: middle; dominant-baseline: hanging;
  paint-order: stroke; stroke: var(--paper); stroke-width: calc(3.5px / var(--zk, 1)); stroke-linejoin: round; pointer-events: none;
  transition: opacity 0.25s;
}
.org .nlabel { font-size: calc(12px / var(--zk, 1)); font-weight: 600; fill: var(--navy); }
.nd.ev .nlabel, .nd.sel .nlabel { fill: var(--navy); font-weight: 700; }
.nlabel.lh { opacity: 0; }
.ripple { fill: none; stroke: var(--navy); stroke-width: 1; pointer-events: none; }
.rtag { pointer-events: none; animation: rtag 3.4s ease-out forwards; }
.rtag rect { fill: var(--navy); }
.rtag text { fill: var(--paper); font-family: var(--font-text); font-weight: 600; font-size: calc(11px / var(--zk, 1)); text-anchor: middle; dominant-baseline: central; }
@keyframes rtag { 0% { opacity: 0; transform: translateY(4px); } 10% { opacity: 1; transform: none; } 78% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
svg.hide-release .rtag { display: none; }

/* Chronicle */
.caption {
  position: absolute; top: 0; left: 0;
  width: min(470px, calc(100% - var(--panel-w) - 40px));
  padding: 16px 20px 14px max(16px, env(safe-area-inset-left, 0px));
  background: var(--scrim); border-bottom: 1px solid var(--hair); border-right: 1px solid var(--hair);
}
.cap-title { margin: 0 0 6px; font-family: var(--font-display); font-weight: 300; font-size: 26px; line-height: 1.15; color: var(--navy); text-wrap: balance; }
.cap-text { margin: 0; font-size: 14px; color: var(--ink); max-width: 62ch; }
.cap-text b { color: var(--navy); font-weight: 700; }
.cap-actors { margin: 6px 0 0; font-size: 13px; color: var(--ink); }
.cap-actors:empty { display: none; }
.actor { border: 0; background: none; padding: 0; cursor: pointer; color: var(--navy); font-weight: 600; text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px; }
.actor:hover { text-decoration-color: var(--navy); }
.cap-src, .rl-src { color: var(--navy); font-size: 13px; text-decoration-color: var(--hair); text-underline-offset: 3px; white-space: nowrap; }
.cap-rel { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--ink); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.cap-rel .tick { width: 2px; height: 11px; background: var(--navy); align-self: center; flex: none; }
.cap-rel b { color: var(--navy); font-weight: 700; }
.cap-rel button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--navy); font-weight: 600; text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px; }
.caption.fresh { animation: capin 0.5s ease; }
@keyframes capin { from { opacity: 0.3; } to { opacity: 1; } }

/* Guide: a ruled side column */
.panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: var(--panel-w);
  background: var(--paper); border-left: 1px solid var(--hair);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden; z-index: 4;
}
.panel-scroll { overflow-y: auto; padding: 18px max(20px, env(safe-area-inset-right, 0px)) 24px 22px; min-height: 0; flex: 1; overscroll-behavior: contain; }
.panel h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 300; font-size: 26px; line-height: 1.15; color: var(--navy); text-wrap: balance; }
.panel h3 { margin: 24px 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 18px; color: var(--navy); }
.panel h3:first-child { margin-top: 0; }
.panel p { margin: 0 0 8px; color: var(--ink); }
.sheet-handle { display: none; }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--navy); cursor: pointer; font-size: 13.5px; font-weight: 600; margin-bottom: 14px; }

.legend { display: grid; }
.lg { display: grid; grid-template-columns: 34px 1fr; align-items: start; gap: 12px; padding: 8px 0; border: 0; border-top: 1px solid var(--hair); background: none; text-align: left; cursor: pointer; width: 100%; }
.lg:first-child { border-top: 0; }
.lg[aria-pressed="false"] { opacity: 0.4; }
.lg b { display: block; font-weight: 700; font-size: 13.5px; color: var(--navy); }
.lg span { display: block; font-size: 13px; color: var(--ink); }
.lg.static { cursor: default; }
.lg svg { width: 34px; height: 22px; overflow: visible; margin-top: 1px; }
.sizekey { display: flex; align-items: flex-end; gap: 16px; padding: 2px 0 10px 46px; }
.sizekey span { display: grid; justify-items: center; gap: 4px; font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
.sizekey svg { overflow: visible; }

.stories { display: grid; }
.story { display: grid; grid-template-columns: 62px 1fr; gap: 1px 12px; text-align: left; padding: 10px 0; border: 0; border-top: 1px solid var(--hair); background: none; cursor: pointer; width: 100%; }
.story:first-child { border-top: 0; }
.story .yr { grid-row: span 2; font-size: 12.5px; font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; padding-top: 1px; }
.story b { font-weight: 700; font-size: 14px; color: var(--navy); }
.story:hover b { text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px; }
.story span { font-size: 13px; color: var(--ink); }

.chron { list-style: none; margin: 0; padding: 0; display: grid; }
.chron button { display: grid; grid-template-columns: 70px 1fr; gap: 10px; width: 100%; text-align: left; padding: 5px 0; border: 0; background: none; cursor: pointer; }
.chron button:hover .t { text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px; }
.chron .d { font-size: 12px; color: var(--ink); padding-top: 1px; font-variant-numeric: tabular-nums; }
.chron .t { font-size: 13.5px; color: var(--ink); }
.chron .w3 .t { color: var(--navy); font-weight: 700; }
.chron .future { opacity: 0.45; }
.chron .now .t { color: var(--navy); font-weight: 700; }
.chron .now .d { color: var(--navy); font-weight: 700; }
.chron li.rl .t::before { content: ""; display: inline-block; width: 2px; height: 10px; background: var(--navy); margin-right: 8px; vertical-align: -1px; }
.chron li.rl .t { font-size: 13px; }
body.hide-release .rk, body.hide-release .chron li.rl { display: none; }

.who { display: grid; grid-template-columns: 60px 1fr; gap: 14px; align-items: center; margin-bottom: 10px; }
.who .big { width: 60px; height: 60px; border-radius: 50%; background: var(--ice); display: grid; place-items: center; overflow: hidden; font-weight: 600; font-size: 19px; color: var(--navy); }
.who .big.o { border-radius: 18px; background: #FFFFFF; border: 1px solid var(--shade); }
.who .big svg { width: 32px; height: 32px; fill: var(--navy); }
.who .big img { width: 100%; height: 100%; object-fit: cover; }
.who .kind { font-size: 13px; color: var(--ink); }
.on-date { font-variant-numeric: tabular-nums; }

.rel { list-style: none; margin: 0; padding: 0; display: grid; }
.rel button { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; width: 100%; padding: 6px 0; border: 0; border-top: 1px solid var(--hair); background: none; text-align: left; cursor: pointer; }
.rel li:first-child button { border-top: 0; }
.rel svg { width: 22px; height: 14px; margin-top: 3px; overflow: visible; }
.rel .nm { font-weight: 700; font-size: 13.5px; color: var(--navy); }
.rel .lb { display: block; font-size: 13px; color: var(--ink); }
.rel .dt { font-size: 12px; color: var(--ink); white-space: nowrap; padding-top: 2px; font-variant-numeric: tabular-nums; }
.rel .later { opacity: 0.45; }
.rel .ended .nm { font-weight: 500; }
.empty { color: var(--ink); font-size: 13px; }

.val { margin: 0 0 2px; font-size: 13.5px; color: var(--ink); }
.val b { font-family: var(--font-display); font-weight: 300; font-size: 30px; color: var(--navy); margin-right: 8px; }
.vsub { font-size: 13px; color: var(--ink); margin: 0 0 6px; }
details.vall { margin-top: 6px; font-size: 13px; color: var(--ink); }
details.vall summary { cursor: pointer; color: var(--navy); font-weight: 600; }
.vlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 3px; }
.vlist li { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; align-items: baseline; font-variant-numeric: tabular-nums; }

.linkhead { margin-bottom: 6px; font-size: 13px; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.pair { margin: 10px 0 12px; font-size: 14px; color: var(--ink); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0; font-size: 13.5px; }
.facts dt { color: var(--ink); }
.facts dd { margin: 0; color: var(--navy); font-weight: 600; font-variant-numeric: tabular-nums; }
.btnrow { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.btn { border: 0; background: none; padding: 0; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--navy); text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px; }
.src { font-size: 13px; text-decoration-color: var(--hair); text-underline-offset: 3px; }
.credit { font-size: 12px; color: var(--ink); margin-top: 6px; }
.about p { font-size: 13px; }
.about .addr { user-select: all; font-weight: 600; color: var(--navy); }

/* Tooltip */
.tip { position: absolute; z-index: 6; pointer-events: none; padding: 7px 10px; background: var(--paper); border: 1px solid var(--hair); font-size: 13px; max-width: 260px; box-shadow: 0 4px 14px rgba(36, 49, 92, 0.08); }
.tip b { display: block; font-weight: 700; color: var(--navy); }
.tip span { color: var(--ink); }

/* Transport: the timeline as a rail */
.transport {
  display: grid; grid-template-columns: auto auto auto 1fr auto auto; align-items: center; gap: 10px 14px;
  padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--hair); background: var(--paper); position: relative; z-index: 5;
}
.tb { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hair); background: var(--paper); display: grid; place-items: center; cursor: pointer; }
.tb:hover { border-color: var(--navy); }
.tb svg { width: 13px; height: 13px; fill: var(--navy); }
.tb.play { width: 42px; height: 42px; background: var(--navy); border-color: var(--navy); }
.tb.play svg { fill: var(--paper); width: 15px; height: 15px; }
.track { position: relative; height: 58px; cursor: pointer; touch-action: none; min-width: 0; }
.rail { position: absolute; left: 0; right: 0; top: 28px; height: 1px; background: var(--bluegrey); }
.fill { position: absolute; left: 0; top: 27.5px; height: 2px; background: var(--navy); }
.yr-tick { position: absolute; top: 44px; transform: translateX(-50%); font-size: 11.5px; color: var(--ink); pointer-events: none; font-variant-numeric: tabular-nums; }
.mk { position: absolute; bottom: 30px; width: 2px; margin-left: -1px; background: var(--bluegrey); border: 0; padding: 0; cursor: pointer; }
.mk.w1 { height: 6px; } .mk.w2 { height: 10px; } .mk.w3 { height: 15px; }
.mk::after, .rk::after { content: ""; position: absolute; inset: -5px -4px; }
.mk.done { background: var(--navy); }
.rk { position: absolute; top: 29px; width: 2px; height: 6px; margin-left: -1px; background: var(--bluegrey); border: 0; padding: 0; cursor: pointer; }
.rk.w2 { height: 9px; }
.rk.done { background: var(--navy); }
.head { position: absolute; top: 21px; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 3px var(--paper); pointer-events: none; }
.mktip { position: absolute; bottom: 58px; transform: translateX(-50%); white-space: nowrap; font-size: 12.5px; padding: 4px 8px; background: var(--paper); border: 1px solid var(--hair); color: var(--navy); pointer-events: none; z-index: 3; }
.now-date { font-size: 14px; font-weight: 700; color: var(--navy); min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
.speed { height: 30px; min-width: 38px; border: 0; background: none; cursor: pointer; font-size: 13.5px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }

/* Narrow screens: the guide becomes a bottom sheet */
@media (max-width: 899px) {
  :root { --panel-w: 0px; }
  .brand a.logo img { height: 26px; }
  .brand .rule, .brand p { display: none; }
  .brand h1 { font-size: 21px; }
  .brand { flex: 1; }
  .flows { flex-wrap: nowrap; overflow-x: auto; width: 100%; order: 3; scrollbar-width: none; }
  .guide-btn { display: inline-flex; order: 2; border: 1px solid var(--hair); padding: 0 12px; }
  .caption { width: auto; right: 0; border-right: 0; padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 12px; }
  .cap-title { font-size: 20px; }
  .cap-text { font-size: 13px; }
  .panel {
    left: 0; right: 0; bottom: 0; top: auto; width: auto; height: 62%; border-left: 0; border-top: 1px solid var(--hair);
    transform: translateY(100%); transition: transform 0.35s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 30px rgba(36, 49, 92, 0.12);
  }
  .panel.open { transform: none; }
  .sheet-handle { display: flex; padding: 10px 18px 0; }
  .sheet-handle span { width: 40px; height: 4px; border-radius: 2px; background: var(--hair); margin: 0 auto; }
  .panel-scroll { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .transport { grid-template-columns: auto auto auto 1fr auto; }
  .speed { display: none; }
  .now-date { min-width: 0; font-size: 13px; }
}
@media (max-width: 520px) {
  .transport { grid-template-columns: auto auto auto 1fr; }
  .now-date { grid-column: 1 / -1; grid-row: 1; text-align: left; }
  .cap-actors { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .lk.money.invest.on { animation: none; }
  .caption.fresh, .rtag { animation: none; }
  .nd .body { transition: opacity 0.2s; }
}
</style>

<div class="app">

const RELEASES = [{"date": "2013-07-29", "org": "google", "title": "word2vec", "text": "Google's open-source tool turned words into lists of numbers that capture meaning. It became a standard building block for language AI.", "weight": 1, "src": "https://en.wikipedia.org/wiki/Word2vec"}, {"date": "2014-11-06", "org": "amazon", "title": "Echo and Alexa", "text": "Amazon launched the Echo speaker with the Alexa voice assistant. It put a talking AI assistant into millions of homes.", "weight": 1, "src": "https://fortune.com/2014/11/06/forget-siri-amazon-now-brings-you-alexa"}, {"date": "2015-11-09", "org": "brain", "title": "TensorFlow", "text": "Google Brain open-sourced its machine-learning software. It gave researchers and companies free tools to build neural networks.", "weight": 1, "src": "https://research.google/blog/tensorflow-googles-latest-machine-learning-system-open-sourced-for-everyone/"}, {"date": "2016-03-23", "org": "microsoft", "title": "Tay", "text": "Microsoft's Twitter chatbot learned abuse from users and posted offensive tweets. Microsoft took it offline within a day.", "weight": 1, "src": "https://en.wikipedia.org/wiki/Tay_(chatbot)"}, {"date": "2017-01", "org": "meta", "title": "PyTorch", "text": "Facebook's AI lab released PyTorch, a flexible deep-learning toolkit. It became the main tool for AI research.", "weight": 1, "src": "https://venturebeat.com/ai/facebook-to-release-pytorch-1-0-and-open-source-ai-tools-for-translation-and-gameplay"}, {"date": "2018-06-11", "org": "openai", "title": "GPT-1", "text": "OpenAI showed a model pre-trained on raw text could then be tuned for many tasks. It started the GPT line.", "weight": 1, "src": "https://en.wikipedia.org/wiki/GPT-1"}, {"date": "2018-11-02", "org": "google", "title": "BERT", "text": "Google open-sourced BERT, a language model pre-trained on large amounts of text. It beat previous records on 11 language tasks.", "weight": 2, "src": "https://research.google/blog/open-sourcing-bert-state-of-the-art-pre-training-for-natural-language-processing/"}, {"date": "2019-02-14", "org": "openai", "title": "GPT-2", "text": "OpenAI held back its full GPT-2 model, saying it could be misused for fake news. It released it in stages instead.", "weight": 1, "src": "https://www.thedrum.com/news/2019/02/17/ai-text-writing-technology-too-dangerous-release-creators-claim"}, {"date": "2020-05-28", "org": "openai", "title": "GPT-3", "text": "OpenAI's model, with 175 billion internal settings, learned new tasks from a few examples. OpenAI sold access to developers, not the model.", "weight": 2, "src": "https://openai.com/index/language-models-are-few-shot-learners"}, {"date": "2020-11-30", "org": "deepmind", "title": "AlphaFold 2", "text": "DeepMind's AlphaFold 2 predicted protein shapes about as well as lab experiments at a scientific contest. Biologists called the problem largely solved.", "weight": 2, "src": "https://en.wikipedia.org/wiki/AlphaFold"}, {"date": "2021-01-05", "org": "openai", "title": "DALL·E and CLIP", "text": "OpenAI showed DALL·E, which drew pictures from text descriptions, and CLIP, which matched images to words.", "weight": 1, "src": "https://www.axios.com/2021/01/05/openai-artificial-intelligence-model-images-dall-e"}, {"date": "2021-06-29", "org": "microsoft", "title": "GitHub Copilot", "text": "GitHub, owned by Microsoft, previewed Copilot, which suggests code as you type. It ran on OpenAI's Codex model.", "weight": 1, "src": "https://github.blog/2021/06/29/introducing-github-copilot-ai-pair-programmer/"}, {"date": "2022-03-22", "org": "nvidia", "title": "H100 chip", "text": "Nvidia announced the H100 'Hopper' chip. It became the most sought-after hardware for training large AI models.", "weight": 1, "src": "https://bigdatawire.com/2022/03/22/nvidia-launches-hopper-h100-gpu-new-dgxs-and-grace-megachips"}, {"date": "2022-04-04", "org": "google", "title": "PaLM", "text": "Google's PaLM had 540 billion internal settings and trained on 6,144 chips. It showed reasoning improving as models grew.", "weight": 1, "src": "https://research.google/blog/pathways-language-model-palm-scaling-to-540-billion-parameters-for-breakthrough-performance/"}, {"date": "2022-07-12", "org": "huggingface", "title": "BLOOM", "text": "Over 1,000 researchers, coordinated by Hugging Face, released a 176-billion-setting model covering 46 languages. Anyone could download it.", "weight": 1, "src": "https://huggingface.co/blog/bloom"}, {"date": "2022-08-22", "org": null, "orgName": "Stability AI", "title": "Stable Diffusion", "text": "Stability AI released an image generator whose model files anyone could download. It ran on home computers and spread fast.", "weight": 2, "src": "https://petapixel.com/2022/08/23/open-source-ai-image-generator-stable-diffusion-released-to-the-public/"}, {"date": "2022-09-16", "org": "characterai", "title": "Character.AI beta", "text": "Ex-Google engineers Noam Shazeer and Daniel De Freitas opened their chatbot site to the public. Users talk to AI characters.", "weight": 1, "src": "https://en.wikipedia.org/wiki/Character.ai"}, {"date": "2022-11-30", "org": "openai", "title": "ChatGPT", "text": "OpenAI released a free chatbot as a 'research preview'. It reached 100 million users in about two months.", "weight": 2, "src": "https://openfuture.eu/note/open-ai-releases-chatgpt/"}, {"date": "2023-02-06", "org": "google", "title": "Bard", "text": "Google announced its Bard chatbot, built on its LaMDA model, to answer ChatGPT. It opened first to trusted testers.", "weight": 1, "src": "https://wraltechwire.com/2023/02/06/google-to-offer-chatgpt-rival-meet-bard/"}, {"date": "2023-02-07", "org": "microsoft", "title": "New Bing", "text": "Microsoft built OpenAI's model into Bing search. Satya Nadella said he wanted Google to 'show that they can dance'.", "weight": 1, "src": "https://techcrunch.com/2023/02/07/microsoft-launches-the-new-bing-with-chatgpt-built-in/"}, {"date": "2023-02-24", "org": "meta", "title": "LLaMA", "text": "Meta shared its LLaMA model with researchers. The files leaked online within about a week, and other open models followed.", "weight": 2, "src": "https://www.deeplearning.ai/the-batch/how-metas-llama-nlp-model-leaked"}, {"date": "2023-03-14", "org": "openai", "title": "GPT-4", "text": "OpenAI's GPT-4 accepted images as well as text. It scored at human level on many professional and academic exams.", "weight": 2, "src": "https://en.wikipedia.org/wiki/GPT-4"}, {"date": "2023-03-14", "org": "anthropic", "title": "Claude", "text": "Anthropic, founded by former OpenAI staff, opened its Claude assistant to wider use. It came as Claude and the cheaper Claude Instant.", "weight": 1, "src": "https://www.anthropic.com/news/introducing-claude"}, {"date": "2023-05-02", "org": "inflection", "title": "Pi", "text": "Inflection, led by DeepMind co-founder Mustafa Suleyman, launched Pi, a chatbot built for supportive personal conversation rather than work.", "weight": 1, "src": "https://www.businesswire.com/news/home/20230502006113/en/"}, {"date": "2023-07-18", "org": "meta", "title": "Llama 2", "text": "Meta released Llama 2 free for research and commercial use, with Microsoft as launch partner. Companies could now build products on it.", "weight": 1, "src": "https://www.axios.com/2023/07/18/meta-llama-2-release-commercial-use"}, {"date": "2023-09-27", "org": "mistral", "title": "Mistral 7B", "text": "Paris start-up Mistral released its first model as a free torrent download. The licence allowed any use.", "weight": 1, "src": "https://techcrunch.com/2023/09/27/mistral-ai-makes-its-first-large-language-model-free-for-everyone/"}, {"date": "2023-11-03", "org": "xai", "title": "Grok", "text": "Elon Musk's xAI launched Grok, a chatbot with live access to posts on X. Musk pitched it against OpenAI.", "weight": 1, "src": "https://en.wikipedia.org/wiki/Grok_(chatbot)"}, {"date": "2023-12-06", "org": "deepmind", "title": "Gemini 1.0", "text": "Google DeepMind launched Gemini in three sizes, built to handle text, images and sound together. It was Google's answer to GPT-4.", "weight": 1, "src": "https://9to5google.com/2023/12/06/google-gemini-1-0/"}, {"date": "2024-02-15", "org": "openai", "title": "Sora", "text": "OpenAI previewed Sora, which made realistic video clips up to a minute long from a text prompt.", "weight": 1, "src": "https://www.axios.com/2024/02/15/openai-text-to-video-sora"}, {"date": "2024-03-04", "org": "anthropic", "title": "Claude 3", "text": "Anthropic's Claude 3 family came in three sizes: Haiku, Sonnet and Opus. Anthropic said Opus beat GPT-4 on several tests.", "weight": 1, "src": "https://www.anthropic.com/news/claude-3-family"}, {"date": "2024-03-16", "org": "tesla", "title": "FSD v12", "text": "Tesla rolled out driving software run by one AI model trained on video. It replaced over 300,000 lines of hand-written code.", "weight": 1, "src": "https://electrek.co/2024/03/16/tesla-full-self-driving-beta-v12-finally-rolls-out/"}, {"date": "2024-05-13", "org": "openai", "title": "GPT-4o", "text": "OpenAI's GPT-4o handled text, sound and images in one model. It could hold a spoken conversation with little delay.", "weight": 1, "src": "https://www.axios.com/2024/05/13/openai-google-chatgpt-ai"}, {"date": "2024-07-23", "org": "meta", "title": "Llama 3.1 405B", "text": "Meta released a 405-billion-setting model it called the first frontier-level open model. Zuckerberg argued open source was the path forward.", "weight": 1, "src": "https://about.fb.com/news/2024/07/open-source-ai-is-the-path-forward/"}, {"date": "2024-09-12", "org": "openai", "title": "o1", "text": "OpenAI's o1 was trained to 'think' step by step before answering. Other labs released reasoning models after it.", "weight": 2, "src": "https://openai.com/index/introducing-openai-o1-preview/"}, {"date": "2024-09-26", "org": "huggingface", "title": "Hub passes 1 million models", "text": "Hugging Face's Hub, the main site for sharing AI models, passed one million public models.", "weight": 1, "src": "https://gigazine.net/gsc_news/en/20240928-hugging-face-ai-models"}, {"date": "2024-11-25", "org": "anthropic", "title": "Model Context Protocol", "text": "Anthropic published the Model Context Protocol, an open standard for linking AI assistants to outside tools and data. Rivals later adopted it.", "weight": 1, "src": "https://www.anthropic.com/news/model-context-protocol"}, {"date": "2024-12-03", "org": "amazon", "title": "Amazon Nova", "text": "Amazon launched Nova, its own AI models for text, images and video. Amazon was also Anthropic's largest investor.", "weight": 1, "src": "https://www.nasdaq.com/press-release/introducing-amazon-nova-new-generation-foundation-models-2024-12-03"}, {"date": "2024-12-26", "org": "deepseek", "title": "DeepSeek-V3", "text": "Chinese lab DeepSeek released a downloadable model close to the best, with a reported $5.6 million final training run.", "weight": 1, "src": "https://the-decoder.com/deepseeks-5-6m-chinese-llm-wonder-shakes-up-the-ai-elite/"}, {"date": "2025-01", "org": "scale", "title": "Humanity's Last Exam", "text": "Scale AI and the Center for AI Safety published Humanity's Last Exam, about 3,000 expert questions. Top models scored under 10%.", "weight": 1, "src": "https://scale.com/blog/humanitys-last-exam-results"}, {"date": "2025-01-20", "org": "deepseek", "title": "DeepSeek-R1", "text": "DeepSeek's free reasoning model rivalled OpenAI's o1. A week later Nvidia lost nearly $600 billion in market value in a day.", "weight": 2, "src": "https://gigazine.net/gsc_news/en/20250128-deepseek-tech-stock-sell-app-store"}, {"date": "2025-02-17", "org": "xai", "title": "Grok 3", "text": "xAI launched Grok 3, trained on its Colossus supercomputer. Musk called it the 'smartest AI on Earth'.", "weight": 1, "src": "https://www.wionews.com/science-technology/smartest-ai-on-earth-elon-musk-to-launch-grok-3-today-all-about-it-8730196"}, {"date": "2025-02-24", "org": "anthropic", "title": "Claude Code", "text": "Anthropic previewed Claude Code, a tool that reads, edits and tests code by itself from a developer's terminal.", "weight": 2, "src": "https://www.anthropic.com/news/claude-3-7-sonnet"}, {"date": "2025-03-25", "org": "deepmind", "title": "Gemini 2.5 Pro", "text": "Google's Gemini 2.5 Pro, a model that reasons before answering, topped the LMArena leaderboard of user preferences.", "weight": 1, "src": "https://blog.google/technology/google-deepmind/gemini-model-thinking-updates-march-2025/"}, {"date": "2025-04-05", "org": "meta", "title": "Llama 4", "text": "Meta released Llama 4, open models built for text and images. A row over its leaderboard testing followed.", "weight": 1, "src": "https://www.techtarget.com/whatis/feature/Meta-Llama-4-explained-Everything-you-need-to-know"}, {"date": "2025-05-22", "org": "anthropic", "title": "Claude 4", "text": "Anthropic released Claude Opus 4 and Sonnet 4, aimed at coding and long tasks. Claude Code became generally available.", "weight": 1, "src": "https://www.anthropic.com/news/claude-4"}, {"date": "2025-07-09", "org": "xai", "title": "Grok 4", "text": "xAI launched Grok 4 and a $300-a-month 'Heavy' tier. It came days after Grok posted antisemitic replies on X.", "weight": 1, "src": "https://techcrunch.com/2025/07/09/elon-musks-xai-launches-grok-4-alongside-a-300-monthly-subscription"}, {"date": "2025-08-05", "org": "openai", "title": "gpt-oss", "text": "OpenAI released gpt-oss, its first downloadable models since GPT-2 in 2019. The licence allowed commercial use.", "weight": 1, "src": "https://openai.com/en/index/introducing-gpt-oss/"}, {"date": "2025-08-07", "org": "openai", "title": "GPT-5", "text": "OpenAI's GPT-5 put fast and reasoning models behind an automatic switch. Users objected, and OpenAI brought back GPT-4o within days.", "weight": 2, "src": "https://infoq.com/news/2025/08/openai-gpt5-release"}, {"date": "2025-08-28", "org": "microsoft", "title": "MAI-1-preview", "text": "Microsoft AI, led by Mustafa Suleyman, unveiled MAI-1-preview, its first large model built fully in-house.", "weight": 1, "src": "https://www.neowin.net/news/microsoft-reveals-two-in-house-ai-models-mai-voice-1-and-mai-1-preview/"}, {"date": "2025-10-01", "org": "tml", "title": "Tinker", "text": "Mira Murati's Thinking Machines Lab launched Tinker, its first product: a service for customising open models with your own data.", "weight": 1, "src": "https://venturebeat.com/ai/thinking-machines-first-official-product-is-here-meet-tinker-an-api-for"}, {"date": "2025-11-18", "org": "deepmind", "title": "Gemini 3", "text": "Google's Gemini 3 led many tests on release. Sam Altman then declared a 'code red' at OpenAI.", "weight": 1, "src": "https://aimagazine.com/news/openai-hits-code-red-after-googles-gemini-3"}, {"date": "2025-12-02", "org": "mistral", "title": "Mistral 3", "text": "Mistral released its Mistral 3 family, topped by Large 3, as downloadable models free for any use.", "weight": 1, "src": "https://decrypt.co/350796/mistral-frontier-ai-family-deepseek"}, {"date": "2026-03", "org": "nvidia", "title": "Nemotron 3 Super", "text": "Nvidia released Nemotron 3 Super, a free 120-billion-setting model, and published its training data.", "weight": 1, "src": "https://dataconomy.com/2026/03/12/nvidia-launches-120b-parameter-nemotron-3-super-open-model/"}, {"date": "2026-03-05", "org": "openai", "title": "GPT-5.4", "text": "OpenAI's GPT-5.4 was its first general model able to operate a computer by reading the screen and using mouse and keyboard.", "weight": 1, "src": "https://interestingengineering.com/ai-robotics/gpt-5-4-openai-ai-model-release"}, {"date": "2026-04-07", "org": "anthropic", "title": "Claude Mythos Preview", "text": "Anthropic withheld Claude Mythos Preview because it could find and exploit software flaws. Selected partners used it to fix them.", "weight": 2, "src": "https://www.anthropic.com/glasswing"}, {"date": "2026-04-08", "org": "meta", "title": "Muse Spark", "text": "Meta Superintelligence Labs released Muse Spark, its first model, after Llama 4 disappointed. Unlike Llama, it launched closed.", "weight": 1, "src": "https://www.cnbc.com/2026/04/08/meta-debuts-first-major-ai-model-since-14-billion-deal-to-bring-in-alexandr-wang.html"}, {"date": "2026-04-23", "org": "openai", "title": "GPT-5.5", "text": "GPT-5.5 was OpenAI's first newly pre-trained base model since GPT-4.5, aimed at long multi-step work. API prices doubled.", "weight": 1, "src": "https://cryptobriefing.com/openai-releases-gpt-55-outperforming-gpt-54-for-paid-chatgpt-users/"}, {"date": "2026-04-24", "org": "deepseek", "title": "DeepSeek V4", "text": "DeepSeek previewed V4: a 1.6-trillion-setting Pro model and a smaller Flash model. Both could read about 750,000 words at once.", "weight": 1, "src": "https://api-docs.deepseek.com/news/news260424/"}, {"date": "2026-05-19", "org": "deepmind", "title": "Gemini 3.5 and Omni", "text": "At Google I/O, Google released Gemini 3.5 Flash and Gemini Omni, which makes video from mixed inputs. Gemini 3.5 Pro was delayed.", "weight": 1, "src": "https://macrumors.com/2026/05/19/google-io-2026-roundup/"}, {"date": "2026-06-09", "org": "anthropic", "title": "Claude Fable 5", "text": "Anthropic released Claude Fable 5, a public version of Mythos with added safeguards. Mythos 5, without them, went only to vetted organisations.", "weight": 1, "src": "https://platform.claude.com/docs/en/models/fable-5/overview"}, {"date": "2026-07-08", "org": "xai", "title": "Grok 4.5", "text": "xAI, now part of SpaceX, launched Grok 4.5 for coding and multi-step tasks. It was trained with Cursor, which SpaceX was buying.", "weight": 1, "src": "https://www.thestar.com.my/tech/tech-news/2026/07/09/spacexai-launches-grok-45-model-for-coding-agentic-tasks"}, {"date": "2026-07-15", "org": "tml", "title": "Inkling", "text": "Thinking Machines released Inkling, its first model, as free-to-download files. The lab said it was not the strongest available.", "weight": 1, "src": "https://techcrunch.com/2026/07/15/thinking-machines-amps-up-its-bet-against-one-size-fits-all-ai-with-its-first-open-model-inkling/"}, {"date": "2026-07-24", "org": "anthropic", "title": "Claude Opus 5", "text": "Anthropic's Claude Opus 5 came close to Fable 5 on many tasks at about half the price.", "weight": 1, "src": "https://www.anthropic.com/news/claude-opus-5"}, {"date": "2026-09-03", "org": "openai", "title": "GPT-6 Astra", "text": "OpenAI's GPT-6 Astra was its first model rated 'Critical' for cyber-attack ability. Access began with vetted business customers.", "weight": 2, "src": "https://www.cnbc.com/2026/09/03/open-ai-astra-gpt-6-cyber.html"}, {"date": "2026-09-30", "org": "deepmind", "title": "Gemini 4 Argon", "text": "Google released Gemini 4 Argon, its most powerful model, to cyber-defence partners first. Public access had no date.", "weight": 1, "src": "https://techcrunch.com/2026/09/30/google-releases-gemini-4-argon-called-its-most-powerful-model-yet/"}, {"date": "2026-10-06", "org": "mistral", "title": "Mistral Large 4", "text": "Mistral previewed Large 4, a model with about one trillion settings. It promised free-to-download files by the end of October.", "weight": 1, "src": "https://mistral.ai/news/mistral-large-4/"}, {"date": "2026-10-15", "org": "meta", "title": "Muse Spark Open", "text": "Meta released Muse Spark Open as free-to-download files. It was Meta's return to open models after April's closed launch.", "weight": 1, "src": "https://techcrunch.com/2026/10/15/meta-launches-an-open-weight-model-that-runs-on-macs/"}];

<script>
(function () {

  const CAT = { role: "work", founder: "work", board: "work", invest: "money", acquire: "money", partner: "money", tie: "tie", rift: "rift" };
  const TYPE_NAME = { role: "Work", founder: "Founder", board: "Board seat", invest: "Investment", acquire: "Takeover", partner: "Deal", tie: "Ally", rift: "Rift" };

    if (s == null) return null;
    const p = String(s).split("-").map(Number);
    return { t: Date.UTC(p[0], (p[1] || 1) - 1, p[2] || 1) / DAY, prec: p.length === 1 ? "y" : p.length === 2 ? "m" : "d" };
  }
  function fmt(t, prec) {
    const d = new Date(t * DAY);
    const y = d.getUTCFullYear(), m = MONTHS[d.getUTCMonth()];
    if (prec === "y") return String(y);
    if (prec === "m") return m + " " + y;
    return d.getUTCDate() + " " + m + " " + y;
  }
  function yearOf(t) { return new Date(t * DAY).getUTCFullYear(); }
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function initials(name) { const w = name.replace(/\(.*?\)/g, "").trim().split(/\s+/); return (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase(); }
  function money(u) {
    if (u >= 1e12) return "$" + (u / 1e12).toFixed(u >= 1e13 ? 0 : 1).replace(/\.0$/, "") + "tn";
    if (u >= 1e9) return "$" + (u >= 1e11 ? Math.round(u / 1e9) : (u / 1e9).toFixed(1).replace(/\.0$/, "")) + "bn";
    return "$" + Math.round(u / 1e6) + "m";
  }
  function safeUrl(u) { return /^https?:\/\//.test(u || "") ? u : ""; }

  const T0 = parseD(DATA.meta.start).t, T1 = parseD(DATA.meta.end).t;
  if (RC_LOGO) document.getElementById("logo-img").src = RC_LOGO; else document.getElementById("logo-link").hidden = true;

  const nodes = [], byId = {};

    n.x = 0; n.y = 0;
    n.renames = (o.rename || []).map(r => ({ t: parseD(r[0]).t, name: r[1], logo: r[2] }));
    nodes.push(n); byId[n.id] = n;
  });
  DATA.people.forEach(p => { const n = Object.assign({}, p, { kind: "person" }); nodes.push(n); byId[n.id] = n; });
  nodes.forEach(n => { n.r = n.kind === "org" ? 18 : 13; });

  const links = DATA.links.filter(l => byId[l.a] && byId[l.b]).map((l, i) => {

    return Object.assign({}, l, { id: "L" + i, na: byId[l.a], nb: byId[l.b], f: f.t, fp: f.prec, e: e ? e.t : Infinity, ep: e ? e.prec : null, cat: CAT[l.type] });
  }).filter(l => l.e > l.f && l.cat);
  nodes.forEach(n => { n.links = []; });
  links.forEach(l => { l.na.links.push(l); l.nb.links.push(l); });

      const hard = n.links.filter(l => l.cat === "work" || l.cat === "money");

      n.appearT = pool.length ? Math.max(T0, Math.min.apply(null, pool.map(l => l.f))) : T0;

      if (!HAS_VALUES) return Math.min(34, 20 + n.links.length * 0.7);

    return k ? Math.min(22, 10.5 + 2.6 * Math.sqrt(k)) : 10;

    .filter(r => r.t >= T0 && r.t <= T1);

  function nameAt(n, t) { let nm = n.name; if (n.renames) n.renames.forEach(r => { if (t >= r.t) nm = r.name; }); return nm; }

  /* ---------- Time state ---------- */
  function computeState(force) {

    const ob = $("rl-org"); ob.textContent = org ? nameAt(org, r.t) : (r.orgName || ""); ob.dataset.id = org ? org.id : ""; ob.disabled = !org;

    $("rl-text").textContent = r.text || "";
    relEl.title = r.text || "";
    setSrc($("rl-src"), r.src);

  }
  capEl.addEventListener("click", e => {
    const b = e.target.closest(".actor, #rl-org"); if (b && b.dataset.id) select({ kind: "node", id: b.dataset.id });
  });

  function fireEvent(ev) {
    computeState();
    if (ev.kind === "release") {
      const n = byId[ev.org];
      if (n) releaseTag(n, ev);
      currentRelease = ev; setRelease(ev, true);
    } else {
      ripple(byId[ev.ids[0]]);
      currentEvent = ev; setCaption(ev, true); markChron();
    }
  }
  const holdFor = ev => (ev.kind === "release" ? HOLD_REL[ev.weight] || 650 : HOLD[ev.weight] || 1300) / speed;

  /* ---------- Transport ---------- */
  const track = $("track"), marks = $("marks");
  const fillEl = $("fill"), headEl = $("head");
  const pct = tt => ((tt - T0) / (T1 - T0)) * 100;
  for (let y = 2012; y <= 2026; y++) {
    const tt = Date.UTC(y, 0, 1) / DAY; if (tt < T0) continue;
    const s = document.createElement("span"); s.className = "yr-tick"; s.style.left = pct(tt) + "%";
    s.textContent = window.innerWidth < 600 ? (y % 2 === 0 ? "’" + String(y).slice(2) : "") : y;
    track.appendChild(s);
  }
  const mkTip = document.createElement("div"); mkTip.className = "mktip"; mkTip.hidden = true; track.appendChild(mkTip);
  timeline.forEach(ev => {
    const b = document.createElement("button");
    b.className = (ev.kind === "release" ? "rk w" : "mk w") + ev.weight; b.style.left = pct(ev.t) + "%";
    const label = fmt(ev.t, ev.prec) + " · " + (ev.kind === "release" ? (ev.org && byId[ev.org] ? nameAt(byId[ev.org], ev.t) : ev.orgName || "") + " releases " : "") + ev.title;
    b.setAttribute("aria-label", label);
    b.addEventListener("click", e => { e.stopPropagation(); jumpToEvent(ev); });
    b.addEventListener("pointerenter", () => { mkTip.textContent = label; mkTip.style.left = Math.min(85, Math.max(15, pct(ev.t))) + "%"; mkTip.hidden = false; });
    b.addEventListener("pointerleave", () => { mkTip.hidden = true; });
    ev.mk = b; marks.appendChild(b);
  });

  let dragging = false;
  function tFromX(clientX) { const r = track.getBoundingClientRect(); return T0 + Math.max(0, Math.min(1, (clientX - r.left) / r.width)) * (T1 - T0); }
  track.addEventListener("pointerdown", e => { if (e.target.classList.contains("mk") || e.target.classList.contains("rk")) return; dragging = true; track.setPointerCapture(e.pointerId); pause(); storyEnd = null; setTime(tFromX(e.clientX)); });
  track.addEventListener("pointermove", e => { if (dragging) setTime(tFromX(e.clientX)); });
  track.addEventListener("pointerup", () => { dragging = false; });
  track.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); setTime(Math.min(T1, t + 30)); }
    if (e.key === "ArrowLeft") { e.preventDefault(); setTime(Math.max(T0, t - 30)); }
  });

  const playBtn = $("play"), playIc = $("play-ic");
  function setPlayIcon() {
    playIc.innerHTML = playing ? '<path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/>' : '<path d="M4 2.5v11l9.5-5.5z"/>';
    playBtn.setAttribute("aria-label", playing ? "Pause" : (t >= T1 ? "Play from 2012" : "Play"));
  }
  function play() {
    if (t >= T1 - 0.5) setTime(T0);
    playing = true; holdUntil = 0; last = performance.now(); setPlayIcon();
  }
  function pause() { playing = false; setPlayIcon(); }
  playBtn.addEventListener("click", () => { if (playing) { pause(); storyEnd = null; } else play(); });
  $("prev").addEventListener("click", () => {
    const ev = [...timeline].reverse().find(e => e.t < t - 0.5 && playable(e)); pause(); storyEnd = null;
    if (ev) jumpToEvent(ev); else setTime(T0);
  });
  $("next").addEventListener("click", () => {
    const ev = timeline.find(e => e.t > t + 0.5 && playable(e)); pause(); storyEnd = null;
    if (ev) jumpToEvent(ev); else setTime(T1);
  });
  const speedBtn = $("speed");
  speedBtn.addEventListener("click", () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; speedBtn.textContent = speed + "×"; });

  function jumpToEvent(ev) {
    setTime(ev.t); fireEvent(ev);
    if (playing) holdUntil = performance.now() + holdFor(ev);
  }

  const bigYear = $("bigyear"), nowDate = $("now-date");
  function setTime(nt) {
    t = Math.max(T0, Math.min(T1, nt));
    const p = pct(t);
    fillEl.style.width = p + "%"; headEl.style.left = p + "%";
    track.setAttribute("aria-valuenow", yearOf(t)); track.setAttribute("aria-valuetext", fmt(t, "d"));
    const y = String(yearOf(t)); if (bigYear.textContent !== y) bigYear.textContent = y;
    nowDate.textContent = fmt(t, "d");
    let ev = null, rel = null;
    for (const e of timeline) { if (e.t > t + 0.01) break; if (e.kind === "moment") ev = e; else rel = e; }
    if (ev !== currentEvent) { currentEvent = ev; setCaption(ev, false); markChron(); }
    if (rel !== currentRelease) { currentRelease = rel; }
    setRelease(currentRelease, false);
    timeline.forEach(e => e.mk.classList.toggle("done", e.t <= t));
    if (computeState()) refreshPanel(); else refreshPanel(true);
    updateOnDate();
    if (!playing) setPlayIcon();
  }

  /* ---------- Loop ---------- */
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing && now >= holdUntil) {
      let nt = t + dt * DAYS_PER_SEC * speed;
      const ev = timeline.find(e => e.t > t + 0.001 && e.t <= nt && playable(e));
      if (ev) nt = ev.t;
      if (storyEnd != null && nt >= storyEnd) nt = storyEnd;
      setTime(nt);
      if (ev) { fireEvent(ev); holdUntil = now + holdFor(ev); }
      if (storyEnd != null && t >= storyEnd) { pause(); storyEnd = null; }
      else if (t >= T1) pause();
    }
    if (sim.alpha() > 0.004) sim.tick();
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- Tooltip ---------- */
  const tip = $("tip"), stage = $("stage");
  function roleNow(n) {
    const w = n.links.filter(l => l.active && l.cat === "work");
    if (!w.length) return n.lone ? "No active ties on this date" : "";
    return w.slice(0, 2).map(l => l.label + ", " + nameAt(other(l, n), t)).join(" · ");
  }
  function showTip(ev, n) {
    if (!n.vis) return;
    let sub;
    if (n.kind === "person") sub = roleNow(n);
    else if (n.val) sub = money(n.val.usd) + " · " + n.val.basis + ", " + fmt(n.val.t, n.val.prec);
    else sub = n.bio || "";
    tip.innerHTML = `<b>${esc(nameAt(n, t))}</b><span>${esc(sub)}</span>`;
    tip.hidden = false; moveTip(ev);
  }
  function showLinkTip(ev, l) {
    tip.innerHTML = `<b>${esc(nameAt(l.na, t))} – ${esc(nameAt(l.nb, t))}</b><span>${esc(l.label)} · ${esc(range(l))}</span>`;
    tip.hidden = false; moveTip(ev);
  }
  function moveTip(ev) {
    const r = stage.getBoundingClientRect();
    let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
    if (x + 270 > r.width) x = ev.clientX - r.left - 270;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.hidden = true; }
  function range(l) {
    if (l.f <= T0 + 1 && l.e === Infinity) return "throughout";
    const a = l.f <= T0 + 1 ? "before 2012" : fmt(l.f, l.fp);
    const b = l.e === Infinity ? "now" : fmt(l.e, l.ep);
    return a + " – " + b;
  }

  /* ---------- Panel ---------- */
  const panel = $("panel"), pb = $("panel-body");
  const guideBtn = $("guide-btn");
  function openSheet(open) { panel.classList.toggle("open", open); guideBtn.setAttribute("aria-expanded", String(open)); }
  guideBtn.addEventListener("click", () => openSheet(!panel.classList.contains("open")));
  panel.querySelector(".sheet-handle").addEventListener("click", () => openSheet(false));

  function swatch(cat, type) {
    const c = `var(--${cat})`;
    if (cat === "work") return `<svg viewBox="0 0 22 14"><line x1="1" y1="7" x2="21" y2="7" stroke="${c}" stroke-width="2" ${type === "board" ? 'stroke-dasharray="1 3" stroke-linecap="round"' : ""}/></svg>`;
    if (cat === "money") return `<svg viewBox="0 0 22 14"><line x1="1" y1="7" x2="21" y2="7" stroke="${c}" stroke-width="${type === "acquire" ? 4 : 2}" ${type === "invest" ? 'stroke-dasharray="4 3"' : type === "partner" ? 'stroke-dasharray="1.5 3" stroke-linecap="round"' : ""}/></svg>`;
    if (cat === "tie") return `<svg viewBox="0 0 22 14"><path d="M1 11 Q11 1 21 11" fill="none" stroke="${c}" stroke-width="2"/></svg>`;
    return `<svg viewBox="0 0 22 14"><path d="M1 11 Q11 1 21 11" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="5 2 2 2"/></svg>`;
  }

  function sizeKey() {
    if (!HAS_VALUES) return "";
    return `<div class="sizekey">${[[1e9, "$1bn"], [1e11, "$100bn"], [1e12, "$1tn"]].map(([u, lb]) => {
      const s = rFromUsd(u) * 2 * 0.62;
      return `<span><svg width="${s}" height="${s}" viewBox="${-s / 2} ${-s / 2} ${s} ${s}"><path d="${squircle(Math.round(s))}" fill="#fff" stroke="var(--shade)"/></svg>${lb}</span>`;
    }).join("")}</div>`;
  }

  function chronRow(e) {
    if (e.kind === "release") {
      const o = e.org && byId[e.org] ? nameAt(byId[e.org], e.t) : e.orgName || "";
      return `<li class="rl"><button data-ev="${e.i}"><span class="d">${fmt(e.t, e.prec === "d" ? "m" : e.prec)}</span><span class="t">${esc(e.title)}${o ? ` <span style="color:var(--ink)">· ${esc(o)}</span>` : ""}</span></button></li>`;
    }

  }

  function guideHTML() {
    const lg = (cat, title, text, svgInner) => `<button class="lg" data-cat="${cat}" aria-pressed="${!hidden.has(cat)}"><svg viewBox="0 0 34 22">${svgInner}</svg><span><b>${title}</b><span>${text}</span></span></button>`;
    return `
      <h3>How to read it</h3>
      <div class="legend">
        <div class="lg static"><svg viewBox="0 0 34 22"><circle cx="9" cy="11" r="8" fill="var(--ice)" stroke="var(--shade)"/><path d="${squircle(16)}" transform="translate(26,11)" fill="#fff" stroke="var(--shade)"/></svg><span><b>Actors</b><span>Circles are people. Rounded squares are organisations. An actor leaves the map while it has no active tie.</span></span></div>
        <div class="lg static"><svg viewBox="0 0 34 22"><path d="${squircle(10)}" transform="translate(6,14)" fill="#fff" stroke="var(--shade)"/><path d="${squircle(20)}" transform="translate(22,11)" fill="#fff" stroke="var(--shade)"/></svg><span><b>Size</b><span>${HAS_VALUES ? "Companies: value on that date, from stock-market value or the last funding round. Each step up is ten times more. Dashed edge: no public value. People: how many ties they have that day." : "Size shows how many ties each actor has."}</span></span></div>
        ${sizeKey()}
        ${lg("work", "Work", "Founded, works at, or sits on the board.", '<line x1="1" y1="8" x2="33" y2="8" stroke="var(--work)" stroke-width="2"/><line x1="1" y1="16" x2="33" y2="16" stroke="var(--work)" stroke-width="2" stroke-dasharray="1 3.5" stroke-linecap="round"/>')}
        ${lg("money", "Money", "Investment flows towards the receiver. Thick lines are takeovers.", '<line x1="1" y1="6" x2="33" y2="6" stroke="var(--money)" stroke-width="2" stroke-dasharray="5 4"/><line x1="1" y1="16" x2="33" y2="16" stroke="var(--money)" stroke-width="4" opacity=".6"/>')}
        ${lg("tie", "Allies", "Friends, family, mentors and close partners.", '<path d="M1 17 Q17 2 33 17" fill="none" stroke="var(--tie)" stroke-width="2"/>')}
        ${lg("rift", "Rifts", "Feuds, firings and lawsuits.", '<path d="M1 17 Q17 2 33 17" fill="none" stroke="var(--rift)" stroke-width="2" stroke-dasharray="7 3 2 3"/>')}
        ${lg("release", "Releases", "Models and products. A tag rises from the company, and a mark sits under the timeline.", '<rect x="2" y="5" width="30" height="12" rx="6" fill="var(--navy)"/>')}
        <div class="lg static"><svg viewBox="0 0 34 22"><line x1="1" y1="11" x2="33" y2="11" stroke="var(--bluegrey)" stroke-width="1"/><circle cx="17" cy="11" r="6" fill="var(--rose)"/></svg><span><b>Now</b><span>The rose drop on the timeline is the date the map shows.</span></span></div>
      </div>

      <h3>Stories</h3>
      <div class="stories">${STORIES.map((s, i) => `<button class="story" data-story="${i}"><span class="yr">${s.yr}</span><b>${esc(s.title)}</b><span>${esc(s.text)}</span></button>`).join("")}</div>
      <h3>Chronicle</h3>
      <ul class="chron" id="chron">${timeline.map(chronRow).join("")}</ul>
      <h3>About this map</h3>
      <div class="about">
        <p>Made by Mark Oldenbeuving at <a href="https://ripplecolab.com/?utm_source=lab&amp;utm_medium=map&amp;utm_campaign=ai-map" target="_blank" rel="noopener">Ripple CoLab</a>, with Claude, from public reporting. It uses the actor-and-flow view behind <a href="https://studio.ripplecolab.com/?utm_source=lab&amp;utm_medium=map&amp;utm_campaign=ai-map" target="_blank" rel="noopener">Ripple Studio</a>.</p>
        <p>Every person, tie, event, release and value links to its source. Dates are to the day where known, otherwise to the month or year.</p>
        <p>Company values are year-end stock-market values for listed companies, and funding-round, share-sale or purchase prices for private ones. A figure older than three years is not used.</p>
        <p>Last updated ${fmt(T1, "d")}. To report an error, email <span class="addr">mark@ripplecolab.com</span>.</p>
        <p>Logos from Simple Icons; trademarks belong to their owners.${Object.keys(FACES).length ? " Photos from Wikimedia Commons, credited on each person's page." : ""}</p>
      </div>`;
  }

  function relRow(l, n) {
    const o = other(l, n);
    const state = l.active ? "" : l.f > t ? "later" : "ended";
    const dir = l.cat === "money" ? (l.na === n ? "→ " : "← ") : "";
    return `<li><button class="${state}" data-link="${l.id}">${swatch(l.cat, l.type)}<span><span class="nm">${dir}${esc(nameAt(o, t))}</span><span class="lb">${esc(l.label)}</span></span><span class="dt">${esc(range(l))}</span></button></li>`;
  }

  function valueHTML(n) {
    if (n.kind !== "org" || !HAS_VALUES) return "";
    const V = VAL[n.id];
    if (!V || V.kind === "none" || !V.pts.length) return `<h3>Value</h3><p class="empty">${esc((V && V.note) || "No public value.")} Drawn small, with a dashed edge.</p>`;
    const p = valueAt(n, t);
    const cur = p
      ? `<p class="val"><b>${money(p.usd)}</b>${esc(p.basis)}, ${fmt(p.t, p.prec)}</p><p class="vsub">${V.kind === "listed" ? "Latest year-end figure before this date." : "Latest figure before this date."} <a href="${esc(safeUrl(p.src))}" target="_blank" rel="noopener">Source</a></p>`
      : `<p class="empty">No known value on this date${V.kind !== "listed" ? " (figures older than three years are not used)" : ""}.</p>`;
    const rows = V.pts.map(q => `<li><span class="dt">${fmt(q.t, q.prec === "d" ? "m" : q.prec)}</span><span>${money(q.usd)} <span class="lb">${esc(q.basis)}</span></span>${safeUrl(q.src) ? `<a href="${esc(q.src)}" target="_blank" rel="noopener">Source</a>` : "<span></span>"}</li>`).join("");
    return `<h3>Value</h3>${cur}${V.note ? `<p class="vsub">${esc(V.note)}</p>` : ""}<details class="vall"><summary>Every figure (${V.pts.length})</summary><ul class="vlist">${rows}</ul></details>`;
  }

  function nodeHTML(n) {
    const act = n.links.filter(l => l.active && !hidden.has(l.cat));
    const order = { work: 0, money: 1, tie: 2, rift: 3 };
    act.sort((a, b) => order[a.cat] - order[b.cat] || a.f - b.f);
    const all = [...n.links].sort((a, b) => a.f - b.f || order[a.cat] - order[b.cat]);
    const mom = moments.filter(e => e.ids.includes(n.id));
    const rels = releases.filter(r => r.org === n.id);
    const src = srcOf(n);
    return `
      <button class="back" data-back>← Guide</button>
      <div class="who">${avatarHTML(n, "big")}<div><div class="kind">${n.kind === "person" ? "Person" : "Organisation"}</div><h2>${esc(nameAt(n, t))}</h2></div></div>
      <p>${esc(n.bio || "")}${src ? ` <a class="src" href="${esc(src)}" target="_blank" rel="noopener">Source</a>` : ""}</p>
      ${CREDITS[n.id] ? `<p class="credit">Photo: <a href="${esc(CREDITS[n.id].page)}" target="_blank" rel="noopener">${esc(CREDITS[n.id].artist || "Wikimedia Commons")}</a>, ${esc(CREDITS[n.id].license)}</p>` : ""}

      <h3>Every tie, in order</h3>
      <ul class="rel">${all.map(l => relRow(l, n)).join("")}</ul>
      ${rels.length ? `<h3>Releases</h3><ul class="chron">${rels.map(chronRow).join("")}</ul>` : ""}
      ${mom.length ? `<h3>Moments</h3><ul class="chron">${mom.map(chronRow).join("")}</ul>` : ""}
    `;
  }

  function linkHTML(l) {
    const dirWord = l.cat === "money" ? "→" : "·";
    const src = safeUrl(l.src);
    return `
      <button class="back" data-back>← Guide</button>
      <div class="linkhead">${swatch(l.cat, l.type)}<span>${TYPE_NAME[l.type]}</span></div>
      <h2>${esc(l.label)}</h2>
      <p class="pair">${actorChip(l.a)} ${dirWord} ${actorChip(l.b)}</p>
      ${l.note ? `<p>${esc(l.note)}</p>` : ""}
      <dl class="facts"><dt>From</dt><dd>${l.f <= T0 + 1 ? "Before 2012" : fmt(l.f, l.fp)}</dd><dt>Until</dt><dd>${l.e === Infinity ? "Still in place" : fmt(l.e, l.ep)}</dd></dl>
      ${src ? `<p><a class="src" href="${esc(src)}" target="_blank" rel="noopener">Source</a></p>` : `<p class="empty">No source recorded.</p>`}
      <div class="btnrow">${l.f > T0 + 1 ? `<button class="btn" data-goto="${l.f}">Go to the start</button>` : ""}${l.e !== Infinity ? `<button class="btn" data-goto="${l.e}">Go to the end</button>` : ""}</div>
    `;
  }

  function renderPanel() {
    let html;
    if (selected && selected.kind === "node") html = nodeHTML(byId[selected.id]);
    else if (selected && selected.kind === "link") { const l = links.find(x => x.id === selected.id); html = l ? linkHTML(l) : guideHTML(); }
    else html = guideHTML();
    const keep = selected ? 0 : pb.scrollTop;
    pb.innerHTML = html;
    pb.scrollTop = keep;
    markChron();
  }
  let lastPanelKey = "";
  function refreshPanel(valueOnly) {
    if (!selected) return;
    const n = selected.kind === "node" ? byId[selected.id] : null;
    const vkey = n && n.kind === "org" ? String(valueAt(n, t) ? valueAt(n, t).t : "-") : "";
    const key = selected.kind + selected.id + activeSig + vkey;
    if (key === lastPanelKey) return; lastPanelKey = key;
    if (valueOnly && !vkey) return;
    const st = pb.scrollTop; renderPanel(); pb.scrollTop = st;
  }
  function updateOnDate() { const d = $("on-date"); if (d) d.textContent = fmt(t, "d"); }
  function markChron() {
    pb.querySelectorAll(".chron button").forEach(b => {
      const e = timeline[+b.dataset.ev];
      b.classList.toggle("now", e === currentEvent || (e === currentRelease && e.t === t));
      b.classList.toggle("future", e.t > t);
    });
    if (playing && !selected) { const now = pb.querySelector(".chron .now"); if (now) { const r = now.getBoundingClientRect(), pr = pb.getBoundingClientRect(); if (r.top < pr.top || r.bottom > pr.bottom) pb.scrollTop += r.top - pr.top - pr.height / 2; } }
  }

  pb.addEventListener("click", e => {
    const b = e.target.closest("button, a"); if (!b || b.tagName === "A") return;
    if (b.hasAttribute("data-back")) return select(null);
    if (b.dataset.cat) return toggleCat(b.dataset.cat);
    if (b.dataset.story) return playStory(STORIES[+b.dataset.story]);
    if (b.dataset.ev) { pause(); storyEnd = null; return jumpToEvent(timeline[+b.dataset.ev]); }
    if (b.dataset.link) { const l = links.find(x => x.id === b.dataset.link); if (l && !l.active) { pause(); setTime(l.f <= T0 + 1 ? T0 : l.f); } return select({ kind: "link", id: b.dataset.link }); }
    if (b.dataset.goto) { pause(); setTime(+b.dataset.goto + 0.01); return; }
    if (b.dataset.id) return select({ kind: "node", id: b.dataset.id });
  });

  function select(s) {
    selected = s; lastPanelKey = "";
    renderPanel();
    pb.scrollTop = 0;
    if (window.innerWidth < 900) openSheet(!!s || panel.classList.contains("open"));
  }

  function toggleCat(cat) {
    if (hidden.has(cat)) hidden.delete(cat); else hidden.add(cat);
    svg.classList.toggle("hide-" + cat, hidden.has(cat));
    if (cat === "release") { document.body.classList.toggle("hide-release", hidden.has(cat)); setRelease(currentRelease, false); }
    document.querySelectorAll(`[data-cat="${cat}"]`).forEach(b => b.setAttribute("aria-pressed", String(!hidden.has(cat))));
    lastPanelKey = ""; if (selected) refreshPanel();
  }
  document.querySelectorAll(".flows .tog[data-cat]").forEach(b => b.addEventListener("click", () => toggleCat(b.dataset.cat)));
  const pastBtn = $("f-past");
  pastBtn.addEventListener("click", () => { showPast = !showPast; pastBtn.setAttribute("aria-pressed", String(showPast)); });

  function playStory(s) {
    const from = parseD(s.from).t;
    storyEnd = s.to ? parseD(s.to).t : T1;
    pause(); setTime(from);
    setCaption(currentEvent, true);
    select({ kind: "node", id: s.focus });
    if (s.speed) { speed = s.speed; speedBtn.textContent = speed + "×"; }
    if (window.innerWidth < 900) openSheet(false);
    setTimeout(() => { playing = true; holdUntil = performance.now() + 700; last = performance.now(); setPlayIcon(); }, 350);
  }

  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea")) return;
    if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === "Escape") { select(null); if (window.innerWidth < 900) openSheet(false); }
  });

  /* ---------- Boot ---------- */
  setTime(T1);
  nodes.forEach(n => { n.r = targetR(n); applySize(n); });
  computeState(true);
  for (let i = 0; i < 400; i++) sim.tick();
  renderPanel();
  setCaption(null, false, true);
  fit(false);
  setPlayIcon();
  let lastPortrait = portrait;
  window.addEventListener("resize", () => {
    layoutHomes();
    if (portrait !== lastPortrait) { lastPortrait = portrait; computeState(true); for (let i = 0; i < 200; i++) sim.tick(); }
    fit(false);
  });
  requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
})();
</script>

</body>
</html>
